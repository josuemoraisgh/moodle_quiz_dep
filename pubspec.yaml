name: moodle_quiz_dep
description: Quiz presencial offline – sem Moodle ou serviços de nuvem. Servidor HTTP local para sincronização em sala.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  flutter_widget_from_html: ^0.15.2
  flutter_math_fork: ^0.7.4
  html: ^0.15.6
  xml: ^6.6.1
  path_provider: ^2.1.5
  # Banco de dados local
  sqflite: ^2.3.3+2
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.0
  # Servidor HTTP local (professor) + cliente HTTP (alunos via Wi-Fi)
  http: ^1.2.2
  shared_preferences: ^2.3.2
  web: ^1.1.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  # QR code dinâmico com IP da máquina
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
